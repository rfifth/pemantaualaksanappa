<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Keseluruhan Pusat Peperiksaan 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        ::-webkit-scrollbar { height: 6px; width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .highlight-pulse { animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse-ring {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans">

    <!-- Header & Progress -->
    <header class="bg-indigo-900 text-white shadow-md p-4 sticky top-0 z-20">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-xl font-bold">Pemantauan Mengikut Zon, Negeri & Pusat</h1>
                <p class="text-indigo-300 text-xs mt-1">Peperiksaan Perkhidmatan Gred 1 - 4 Siri 2 Tahun 2026</p>
            </div>
            
            <div class="flex flex-col md:flex-row items-center gap-4 w-full md:w-auto">
                <div id="public-highlight-badge" class="hidden bg-yellow-400 text-yellow-900 px-3 py-1 rounded-full text-xs font-bold shadow-md animate-pulse whitespace-nowrap">
                    Sesi Semasa: Tiada
                </div>

                <div class="w-full md:w-64">
                    <div class="flex justify-between text-xs mb-1">
                        <span class="text-indigo-200">Kadar Selesai Keseluruhan</span>
                        <span id="overall-progress-text" class="font-bold text-green-400">0%</span>
                    </div>
                    <div class="w-full bg-indigo-950 rounded-full h-3">
                        <div id="overall-progress-bar" class="bg-green-400 h-3 rounded-full transition-all duration-500 w-0"></div>
                    </div>
                </div>

                <!-- Admin Controls -->
                <div id="admin-controls" class="hidden items-center gap-2 bg-indigo-800 px-2 py-1.5 rounded border border-indigo-700">
                    <span class="text-xs text-indigo-200 font-semibold whitespace-nowrap">Highlight:</span>
                    <select id="highlight-select" onchange="setHighlight(this.value)" class="text-xs text-slate-800 rounded px-1 py-0.5 outline-none font-bold">
                        <option value="0">Tutup</option>
                        <option value="1">Sesi 1</option>
                        <option value="2">Sesi 2</option>
                        <option value="3">Sesi 3</option>
                        <option value="4">Sesi 4</option>
                        <option value="5">Sesi 5</option>
                        <option value="6">Sesi 6</option>
                        <option value="7">Sesi 7</option>
                        <option value="8">Sesi 8</option>
                        <option value="9">Sesi 9</option>
                        <option value="10">Sesi 10</option>
                        <option value="11">Sesi 11</option>
                        <option value="12">Sesi 12</option>
                    </select>
                </div>

                <button id="admin-btn" onclick="toggleAdmin()" class="bg-blue-500 hover:bg-blue-600 px-3 py-1.5 text-xs rounded font-semibold shadow transition whitespace-nowrap">Log Masuk Admin</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto p-4 pb-12">
        <div class="mb-4 flex flex-wrap gap-4 text-xs font-semibold text-slate-600 bg-white p-3 rounded-lg shadow-sm border border-slate-200">
            <span class="flex items-center gap-1"><span class="w-4 h-4 bg-white border border-slate-300 rounded-full inline-block"></span> Belum Ditanda</span>
            <span class="flex items-center gap-1"><span class="w-4 h-4 bg-green-500 border border-green-600 rounded-full inline-block"></span> Selesai</span>
            <span class="flex items-center gap-1"><span class="w-4 h-4 bg-yellow-300 border border-yellow-400 rounded-full inline-block animate-pulse"></span> Sesi Semasa Berlangsung (Perlu ditanda)</span>
        </div>

        <div id="dashboard-container" class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-6 items-start">
            <!-- UI Akan dijana terus di sini -->
        </div>
    </main>

    <!-- Modal Edit Admin -->
    <div id="edit-modal" class="hidden fixed inset-0 bg-slate-900 bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-md overflow-hidden">
            <div class="bg-slate-800 px-4 py-3 text-white flex justify-between items-center">
                <h3 class="font-bold">Edit Maklumat Pusat</h3>
                <button onclick="closeModal()" class="text-slate-300 hover:text-white">&times;</button>
            </div>
            <div class="p-4 space-y-4">
                <input type="hidden" id="edit-id">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Nama Pusat</label>
                    <input type="text" id="edit-name" class="w-full border border-slate-300 rounded px-3 py-2 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Sesi Terlibat (Pisahkan koma)</label>
                    <input type="text" id="edit-sessions" class="w-full border border-slate-300 rounded px-3 py-2 text-sm" placeholder="Contoh: 1,2,3">
                </div>
            </div>
            <div class="bg-slate-50 px-4 py-3 border-t flex justify-end gap-2">
                <button onclick="closeModal()" class="px-4 py-2 bg-slate-200 text-slate-700 text-sm font-semibold rounded">Batal</button>
                <button onclick="saveEdit()" class="px-4 py-2 bg-indigo-600 text-white text-sm font-semibold rounded">Simpan Data</button>
            </div>
        </div>
    </div>

    <script>
        // =========================================================
        // MASUKKAN FIREBASE CONFIG ANDA DI SINI
        // =========================================================
        const firebaseConfig = {
            apiKey: "API_KEY_ANDA",
            authDomain: "PROJEK_ANDA.firebaseapp.com",

            projectId: "PROJEK_ANDA",
            storageBucket: "PROJEK_ANDA.appspot.com",
            messagingSenderId: "SENDER_ID_ANDA",
            appId: "APP_ID_ANDA"
        };
        // =========================================================

        // Initialize Firebase
        if (!firebase.apps.length) {
            try {
                firebase.initializeApp(firebaseConfig);
